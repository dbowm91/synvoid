# SynVoid DNS — Authoritative-Only Public Profile
#
# Serving DNS zones to the internet.
# This is the most common production deployment profile.
#
# Support status: Production-Supported

[dns]
enabled = true
bind_address = "0.0.0.0"
port = 53
# Standalone mode — no mesh integration
mode = "standalone"

[dns.settings]
default_ttl = 300
cache_enabled = true
cache_size = 100000
cache_max_ttl = 3600
cache_min_ttl = 60
negative_cache_ttl = 300

# Rate limiting — protect against query floods
[dns.ratelimit]
mode = "shared"
per_second = 500
per_minute = 5000

[dns.rrl]
enabled = true
responses_per_second = 100
window_secs = 5
max_responses = 1000
ttl = 300

# Firewall — recommended for production
[dns.firewall]
enabled = true
block_internal_ips = true
# IMPORTANT: Zone transfers should be blocked for public authoritative servers
block_zone_transfers = true

[dns.firewall.rebinding_protection]
# NOTE (Phase 45): DNS rebinding protection is NOT enforced in the query
# path yet. Validation rejects enabled=true while the firewall is on, so
# this must stay false until response-path enforcement lands.
enabled = false
min_ttl_for_internal = 1800

# Connection limits
[dns.limits]
max_tcp_connections = 500
max_concurrent_queries = 2500
max_query_size = 65535
max_response_size = 65535
max_records_per_response = 1000
max_tcp_idle_time_secs = 300
max_tcp_query_time_secs = 30

# Zones are declared here and activated at server startup. A declared zone must
# carry at least one SOA record, or config validation rejects it.
# Zone *files* are still not loaded via config; use the admin API or the SQLite
# zone store for those.
[[dns.zones.items]]
zone = "example.com"
records = [
  # RFC 1035 3.3.13 requires an SOA in every authoritative zone. All seven
  # fields are required: mname rname serial refresh retry expire minimum.
  { name = "example.com", record_type = "soa", value = "ns1.example.com. admin.example.com. 2026100501 3600 900 604800 3600" },
  { name = "example.com", record_type = "ns", value = "ns1.example.com." },
  { name = "www.example.com", record_type = "a", value = "192.0.2.1" },
]

# WARNING: Do NOT enable the following for a public authoritative server:
#   - dns.recursive (creates an open resolver)
#   - dns.dynamic_update (allows unauthenticated zone modifications)
#   - dns.settings.allow_transfer (exposes zone data)
#   - dns.doh/dot/doq (unless you have certs and need encrypted transport)
