# SynVoid dependency policy (Phase 25 baseline; Phases 26-31 landed; corrective pass normalizes metadata)
# Reviewed: 2026-09-13 (corrective pass: milestone labels replaced with calendar Re-audit dates)
# Run: cargo deny check && cargo audit
# Owner: security / release
# Pinned tool: cargo-deny 0.20.2 (see docs/testing/verification-contract.md)
# Evidence: architecture/dependency_security_baseline_phase25.md (binding for
# version/feature/capability separation; this file summarizes, that file proves).
# Phase 26: `yara-x` single owner is `synvoid-yara`; `synvoid-mesh` no longer
# links it, `synvoid-upload` consumes it only via `synvoid-yara` (guard:
# yara_execution_boundary.rs). Phase 40: the YARA transitive Wasmtime line
# is 47.0.4 (via the temporary `third-party/yara-x-compat` manifest-only
# fork of official yara-x 1.20.0; see its README.SYNVOID.md). Wasmtime
# 40.0.4 is gone from the graph, so the 40.x-only advisory ignores were
# removed (RUSTSEC-2026-0085..0096, -0114, -0222, -0269); both resolved
# Wasmtime lines (direct 36.0.15 LTS, transitive 47.0.4) are version-patched
# for those advisories (see
# architecture/dependency_security_baseline_phase25.md §4/§6/§11).
#
# Advisory-ignore metadata rule (enforced by deny_ignore_metadata_guard):
# every ignored advisory MUST state dependency path, affected capability,
# whether wasmtime-wasi is resolved, exposure, Owner:, Reviewed: YYYY-MM-DD,
# Re-audit: YYYY-MM-DD (single machine-enforced future deadline), and
# Remove condition: (upstream/event, not a date). Stale "patched" language
# for RUSTSEC-2026-0269 is forbidden where it does not apply: the direct
# 36 LTS runtime IS patched (>=36.0.14); the transitive yara-x 40.0.4 line is
# affected and capability-gated (see §4 and the 0269 entry below).

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "IJG",
]
confidence-threshold = 0.8

[advisories]
# All ignored advisories must have: rationale, exposure assessment, review date.
# Ignored advisories are re-audited on each major release.
ignore = [
    # RUSTSEC-2023-0071: rsa Marvin Attack (Bleichenbacher timing)
    # Dependency path: synvoid-yara -> yara-x 1.20.0 (compat fork) -> rsa
    #   0.9.10 (transitive; also via synvoid-dns/keystore/tls verification
    #   paths; no direct root edge since Phase 31 removed the unused root
    #   rsa dependency). Still present after the Phase 40 upgrade (yara-x
    #   `crypto` feature unchanged); no fixed upgrade available upstream.
    # Affected capability: RSA signing/decryption timing side-channel.
    # Exposure: LOW — yara-x uses RSA only for optional rule signature verification;
    #   SynVoid verifies rule feeds with ed25519-dalek instead. The rsa code path is
    #   never invoked in SynVoid operation.
    # Owner: security.
    # Reviewed: 2026-09-18.
    # Re-audit: 2026-10-01.
    # Remove condition: yara-x moves off rsa, or RSA-based YARA signing is enabled
    #   (in which case this advisory MUST be resolved immediately).
    # Escalation: If RSA-based YARA signing is ever enabled, this advisory MUST be resolved.
    "RUSTSEC-2023-0071",

    # Phase 40: wasmtime 40.0.4 is absent from Cargo.lock (YARA line is now
    # 47.0.4 via the compat fork). The RUSTSEC-2026-0085..0096, -0114,
    # -0222, and -0269 ignores lived only for that retired path and are
    # removed here — `cargo deny check` emits `advisory-not-detected` if a
    # stale ignore is re-added while no affected wasmtime resolves, and
    # `wasmtime_transitive_matches_baseline` pins the expected YARA line.
    # Do NOT re-add them without a version-affected wasmtime in the graph;
    # do not describe a capability-unreachable advisory as patched (see the
    # baseline §3 for the wasmtime-wasi absence evidence, which still holds).

    # RUSTSEC-2026-0235: rkyv 0.7.46 insufficient archive validation (Rc/Arc OOB reads).
    # Dependency path: minify-html -> lightningcss -> parcel_sourcemap -> rkyv 0.7.46 (transitive).
    # Affected capability: archive deserialization with Rc/Arc.
    # Exposure: LOW — SynVoid's own code uses rkyv 0.8.x; the 0.7 instance only handles
    #   minifier-internal sourcemaps, never untrusted network archives.
    # Owner: security.
    # Reviewed: 2026-09-13.
    # Re-audit: 2026-10-01.
    # Remove condition: lightningcss/parcel_sourcemap drops rkyv 0.7.
    "RUSTSEC-2026-0235",
]

# Deny yanked crates (prevents accidental use of withdrawn versions)
yanked = "deny"
# Phase 25: scope unmaintained/unsound gating to workspace crates (cargo-deny 0.20
# schema: all | workspace | transitive | none). Rationale: "all" renders every
# transitive notice (bincode-compat, yew-chain proc-macro-error, im-rc/sized-chunks
# via admin-ui) as a hard error, which would force broader ignores — explicitly a
# Phase 25 rejection criterion. "workspace" keeps teeth where we have agency (our
# own crates must never go unmaintained/unsound without failing this gate) while
# transitive notices stay visible via `cargo audit` warnings + the SECURITY.md
# triage table. This is a reassessment, not silencing: "none" checked nothing.
unmaintained = "workspace"
unsound = "workspace"

[bans]
multiple-versions = "warn"
# Phase 25: wildcard version requirements are denied for workspace crates.
# No workspace manifest uses `*` (verified 2026-09-12); verify-release rejects them too.
wildcards = "deny"

# Duplicate-version allowlist (narrow): the wasmtime 47.0.4 (YARA transitive,
# via the temporary `third-party/yara-x-compat` fork of official yara-x
# 1.20.0) + 36.0.15 (direct LTS runtime) split is documented in
# architecture/dependency_security_baseline_phase25.md §4/§6/§11 and
# collapses to a single supported line when an official fixed yara-x
# release replaces the fork.
# The skip silences only the multiple-versions warning for the direct runtime pin.
[[bans.skip]]
name = "wasmtime"
version = "=36.0.15"

[sources]
# Phase 37: unknown registries are denied (crates.io only). Unknown git sources are
# denied with NO exceptions: the wasmtime 42.0.2 git patch is removed (direct
# runtime is 36.0.15 LTS from crates.io) and no other git dependency remains
# (verified: no `git =` in any manifest, no `git+` source in Cargo.lock).
# Re-adding any git source requires an allow-git entry plus baseline evidence.
unknown-registry = "deny"
unknown-git = "deny"
