# SynVoid dependency policy (Phase 25 baseline)
# Reviewed: 2026-09-12 (Phase 25 — dependency security baseline and entitlement)
# Run: cargo deny check && cargo audit
# Owner: security / release
# Pinned tool: cargo-deny 0.20.2 (see docs/testing/verification-contract.md)
# Evidence: architecture/dependency_security_baseline_phase25.md (binding for
# version/feature/capability separation; this file summarizes, that file proves).
#
# Advisory-ignore metadata rule (enforced by deny_ignore_metadata_guard):
# every ignored advisory MUST state dependency path, affected capability,
# whether wasmtime-wasi is resolved, exposure, owner, and a review/remove-by
# date tied to Phase 26. Stale "patched" language for RUSTSEC-2026-0269 is
# forbidden: 42.0.2 is affected, capability-gated, upgrade-blocked (see §4).

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "IJG",
]
confidence-threshold = 0.8

[advisories]
# All ignored advisories must have: rationale, exposure assessment, review date.
# Ignored advisories are re-audited on each major release.
ignore = [
    # RUSTSEC-2023-0071: rsa Marvin Attack (Bleichenbacher timing)
    # Dependency path: yara-x 1.15 -> rsa 0.9.10 (transitive; also direct root rsa for legacy auth).
    # Affected capability: RSA signing/decryption timing side-channel.
    # Exposure: LOW — yara-x uses RSA only for optional rule signature verification;
    #   SynVoid verifies rule feeds with ed25519-dalek instead. The rsa code path is
    #   never invoked in SynVoid operation.
    # Owner: security. Review: 2026-07-07. Remove-by: Phase 26 (reassess with yara-x consolidation) or re-audit 2026-10-01.
    # Escalation: If RSA-based YARA signing is ever enabled, this advisory MUST be resolved.
    "RUSTSEC-2023-0071",

    # wasmtime 40.0.4 advisories — transitive via yara-x 1.15 (YARA rule compilation
    # only, never the WASM plugin sandbox). The direct runtime is wasmtime 42.0.2 via
    # [patch.crates-io], which IS a fixed version for each advisory in this group
    # (fixed ranges include >=42.0.2,<43.0.0); only the yara-x 40.0.4 instance is ignored.
    # wasmtime-wasi resolved: NO (absent from Cargo.lock; see dependency_security_baseline_phase25.md §1-§2).
    # Owner: security. Review: 2026-07-07. Remove-by: Phase 26 (yara-x consolidation) or re-audit 2026-10-01.
    # Escalation: Upgrade yara-x when upstream moves off wasmtime 40.x.
    "RUSTSEC-2026-0085",
    "RUSTSEC-2026-0086",
    "RUSTSEC-2026-0087",
    "RUSTSEC-2026-0088",
    "RUSTSEC-2026-0089",
    "RUSTSEC-2026-0091",
    "RUSTSEC-2026-0092",
    "RUSTSEC-2026-0093",
    "RUSTSEC-2026-0094",
    "RUSTSEC-2026-0095",
    "RUSTSEC-2026-0096",
    "RUSTSEC-2026-0114",

    # RUSTSEC-2026-0222: wasmtime type-index confusion.
    # Dependency path: yara-x 1.15 -> wasmtime 40.0.4 (transitive, YARA compilation only).
    # Affected capability: multi-engine type-index mixing (requires hostile multi-engine
    #   guest setup; yara-x runs single-engine rule bytecode).
    # wasmtime-wasi resolved: NO. Exposure: LOW for the yara-x path; direct 42.0.2 is patched.
    # Owner: security. Review: 2026-08-28. Remove-by: Phase 26 or re-audit 2026-10-01.
    "RUSTSEC-2026-0222",

    # RUSTSEC-2026-0269: Wasmtime filesystem sandbox escape (trailing-slash paths/symlinks).
    # Dependency path: (a) yara-x 1.15 -> wasmtime 40.0.4 (transitive); (b) direct
    #   wasmtime 42.0.2 via [patch.crates-io] (synvoid-plugin-runtime). BOTH versions
    #   are in the affected range 37.0.0..=46.0.2. 42.0.2 is NOT patched for this advisory.
    # Affected capability: wasmtime-wasi filesystem preopen sandboxing.
    # wasmtime-wasi resolved: NO — absent from Cargo.lock; neither consumer links the
    #   vulnerable crate, so the trailing-slash handling is unreachable (capability
    #   absence, proven from the resolved graph in dependency_security_baseline_phase25.md §3).
    # Upgrade blocked: wasmtime >=46.0.3 needs bumpalo ^3.20.2, oxc_allocator 0.95.0
    #   (via minify-html 0.18.1) pins bumpalo =3.19.0 — unresolvable, see baseline §4.
    # Owner: security. Remove-by: Phase 26 (re-attempt >=46.0.3 upgrade) or re-audit 2026-10-01.
    "RUSTSEC-2026-0269",

    # RUSTSEC-2026-0235: rkyv 0.7.46 insufficient archive validation (Rc/Arc OOB reads).
    # Dependency path: minify-html -> lightningcss -> parcel_sourcemap -> rkyv 0.7.46 (transitive).
    # Affected capability: archive deserialization with Rc/Arc.
    # Exposure: LOW — SynVoid's own code uses rkyv 0.8.x; the 0.7 instance only handles
    #   minifier-internal sourcemaps, never untrusted network archives.
    # Owner: security. Review: 2026-08-28. Remove-by: Phase 26 (lightningcss/parcel_sourcemap change) or re-audit 2026-10-01.
    "RUSTSEC-2026-0235",
]

# Deny yanked crates (prevents accidental use of withdrawn versions)
yanked = "deny"
# Phase 25: scope unmaintained/unsound gating to workspace crates (cargo-deny 0.20
# schema: all | workspace | transitive | none). Rationale: "all" renders every
# transitive notice (bincode-compat, yew-chain proc-macro-error, im-rc/sized-chunks
# via admin-ui) as a hard error, which would force broader ignores — explicitly a
# Phase 25 rejection criterion. "workspace" keeps teeth where we have agency (our
# own crates must never go unmaintained/unsound without failing this gate) while
# transitive notices stay visible via `cargo audit` warnings + the SECURITY.md
# triage table. This is a reassessment, not silencing: "none" checked nothing.
unmaintained = "workspace"
unsound = "workspace"

[bans]
multiple-versions = "warn"
# Phase 25: wildcard version requirements are denied for workspace crates.
# No workspace manifest uses `*` (verified 2026-09-12); verify-release rejects them too.
wildcards = "deny"

# Duplicate-version allowlist (narrow): the wasmtime 40.0.4 (yara-x transitive) +
# 42.0.2 (direct runtime) split is documented in
# architecture/dependency_security_baseline_phase25.md §4/§6 and collapses in Phase 26.
# The skip silences only the multiple-versions warning for the direct runtime pin.
[[bans.skip]]
name = "wasmtime"
version = "=42.0.2"

[sources]
# Phase 25: unknown registries are denied (crates.io only). Unknown git sources are
# denied; exactly one git source is allowlisted (the wasmtime 42.0.2 runtime patch,
# removal tracked in dependency_security_baseline_phase25.md §4).
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/bytecodealliance/wasmtime"]
