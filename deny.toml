# SynVoid dependency policy
# Reviewed: 2026-07-08 (Milestone B release cleanup — license metadata + BSL-1.0 allowlist)
# Run: cargo deny check && cargo audit
# Owner: security / release

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "IJG",
]
confidence-threshold = 0.8

[advisories]
# All ignored advisories must have: rationale, exposure assessment, review date.
# Ignored advisories are re-audited on each major release.
ignore = [
    # RUSTSEC-2023-0071: rsa Marvin Attack (Bleichenbacher timing)
    # Exposure: transitive via yara-x → rsa crate. RSA is only used for optional YARA rule
    #   signature verification. SynVoid uses ed25519-dalek for rule feed signing instead.
    #   The rsa code path is never invoked in SynVoid operation.
    # Risk: low — RSA signing/decryption is not called; Marvin Attack requires chosen ciphertext.
    # Review: 2026-07-07. Re-audit: 2026-10-01.
    # Escalation: If RSA-based YARA signing is ever enabled, this advisory MUST be resolved.
    "RUSTSEC-2023-0071",

    # wasmtime 40.0.4 advisories — transitive via yara-x (YARA compilation only, not wasm sandbox).
    # Mitigated by [patch.crates-io] pinning wasmtime 42.0.2 for direct usage.
    # yara-x's transitive wasmtime 40.0.4 is only used for YARA rule compilation.
    # Review: 2026-07-07. Re-audit: 2026-10-01.
    # Escalation: Upgrade yara-x when upstream ships wasmtime ≥42.x support.
    "RUSTSEC-2026-0085",
    "RUSTSEC-2026-0086",
    "RUSTSEC-2026-0087",
    "RUSTSEC-2026-0088",
    "RUSTSEC-2026-0089",
    "RUSTSEC-2026-0091",
    "RUSTSEC-2026-0092",
    "RUSTSEC-2026-0093",
    "RUSTSEC-2026-0094",
    "RUSTSEC-2026-0095",
    "RUSTSEC-2026-0096",
    "RUSTSEC-2026-0114",

    # RUSTSEC-2026-0222: wasmtime 40.0.4 remains transitive through yara-x
    # 1.15, whose dependency constraint cannot use SynVoid's patched 42.0.2.
    # Exposure: YARA compilation only; SynVoid's runtime sandbox uses the
    # patched 42.0.2 dependency. Review: 2026-08-28. Re-audit: 2026-10-01.
    "RUSTSEC-2026-0222",

    # RUSTSEC-2026-0269: Wasmtime 40.0.4 filesystem sandbox escape. The
    # vulnerable version remains transitive through yara-x 1.15 and is used
    # only for YARA rule compilation; SynVoid's WASM runtime uses the patched
    # direct Wasmtime 42.0.2 dependency. Upgrade yara-x when it supports a
    # patched Wasmtime release without the current workspace dependency
    # conflict. Review: 2026-08-31. Re-audit: 2026-10-01.
    "RUSTSEC-2026-0269",

    # RUSTSEC-2026-0235: rkyv 0.7.46 is transitive through
    # minify-html -> lightningcss -> parcel_sourcemap. SynVoid does not use
    # this archive format in the static-file path, and all direct rkyv users
    # are on 0.8.18. Review: 2026-08-28. Re-audit: 2026-10-01.
    "RUSTSEC-2026-0235",
]

# Deny yanked crates (prevents accidental use of withdrawn versions)
yanked = "deny"

# Deny unused dependencies
unmaintained = "none"

[bans]
multiple-versions = "warn"
wildcards = "allow"

# Deny known-vulnerable wasmtime versions in the lockfile.
# SynVoid pins wasmtime 42.0.2 (direct) and yara-x transitive wasmtime must not exceed 42.x.
# wasmtime 40.0.4 (yanked) had Cranelift aarch64 sandbox escape (CVE-2024-XXXXXX).
[[bans.skip]]
name = "wasmtime"
version = "=42.0.2"

[sources]
unknown-registry = "warn"
unknown-git = "deny"
allow-git = ["https://github.com/bytecodealliance/wasmtime"]
