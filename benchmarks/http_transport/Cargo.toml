[package]
name = "http-transport-bench"
version = "0.1.0"
edition = "2021"
description = "Phase 63 manual-only eggfetch/legacy transport comparison harness (never a CI gate)"

# Detached from the workspace on purpose: this harness is overlaid onto
# immutable revision worktrees (including pre-migration trees that predate
# eggfetch), so it must resolve its own dependency set per worktree.
[workspace]

# Mirrors the root workspace `ci` profile so `--profile ci` means the same
# thing here as in routine verification (and matches the Phase 62 evidence).
[profile.ci]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"
incremental = false
panic = "unwind"

[features]
default = ["eggfetch"]
# `eggfetch` gates the eggfetch_current adapter. Overlay builds against the
# immutable legacy revision pass `--no-default-features` so the same harness
# source compiles where `synvoid_http_client::eggfetch_transport` does not
# yet exist. The legacy adapter uses only long-frozen API present in both.
eggfetch = []

[dependencies]
synvoid-http-client = { path = "../../crates/synvoid-http-client" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "http2"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging", "aws-lc-rs"] }
rustls-pki-types = "1"
rustls-pemfile = "2"
