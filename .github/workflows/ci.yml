name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Phase 25: scheduled security run so newly published advisories are
  # detected even when the repo has no commit.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      sandbox_native_qualification:
        description: Run the Phase 94 Linux Landlock/seccomp and jail proof lane
        type: boolean
        required: false
        default: false
      icmp_native_qualification:
        description: Run the Phase 93 disposable Linux nftables qualification matrix twice
        type: boolean
        required: false
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      # Pinned third-party Actions (Phase 25 reproducible baseline).
      # Each pin is an immutable commit SHA; the trailing comment records
      # the human-readable tag for maintenance. Bump intentionally only.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Toolchain comes from rust-toolchain.toml (pinned Rust 1.98.1).
      # No `toolchain:` input on purpose: the repo file is authoritative.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable as of 2026-09-12
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Pinned verification tools (versions recorded in
      # docs/testing/verification-contract.md). taiki-e/install-action
      # supports `tool@version` pinning for all three.
      - name: Install pinned verification tools
        uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2
        with:
          tool: nextest@0.9.140,cargo-deny@0.20.2,cargo-audit@0.22.2

      - name: Verify
        run: cargo xtask verify

  # `admin-ui/dist` is a committed build artifact that the admin server serves
  # directly (`resolve_admin_ui_assets` in `src/admin/mod.rs`). Nothing in
  # `cargo xtask verify` rebuilds it, so it drifted silently once already: the
  # shipped WASM lagged the Rust sources by ~3 months while the stylesheet was
  # regenerated separately. This job is the build `dist` has never had.
  admin-ui-build:
    name: admin-ui-build
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No `toolchain:` input: rust-toolchain.toml is authoritative. The pinned
      # 1.98.1 is what makes the rebuilt bundle byte-comparable to the committed
      # one, so the drift check below is not noise.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable as of 2026-09-12
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2
        with:
          tool: trunk@0.21.14

      # Node ships preinstalled on ubuntu-latest; no setup-node pin needed.
      - name: Build admin UI
        working-directory: admin-ui
        run: npm ci && npm run build

      # `git status --porcelain` rather than `git diff`: Trunk renames the
      # bundle on every build, so drift shows up as an untracked new hash plus a
      # deleted old one. `git diff` alone only sees the deleted half.
      - name: Assert committed dist matches source
        run: |
          drift="$(git status --porcelain -- admin-ui/dist)"
          if [ -n "$drift" ]; then
            echo "::error::admin-ui/dist is stale — the committed build artifact does not match admin-ui/src."
            echo "Run 'cd admin-ui && npm run build' and commit the result."
            echo "$drift"
            exit 1
          fi

  dependency-security:
    name: dependency-security
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable as of 2026-09-12

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install pinned verification tools
        uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2

      - name: Dependency policy (cargo-deny)
        run: cargo deny check

      - name: Advisory audit (cargo-audit)
        run: cargo audit

  sandbox-native-qualification:
    name: sandbox-native-qualification
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.sandbox_native_qualification }}
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable as of 2026-09-12
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Record proof host
        run: |
          {
            echo '## Phase 94 Linux sandbox native qualification'
            echo "- Proof SHA: $GITHUB_SHA"
            echo "- Runner: $RUNNER_OS / $RUNNER_ARCH"
            echo "- Kernel: $(uname -a)"
            echo "- Rust: $(rustc -Vv | tr '\n' ' ')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Linux sandbox enforcement probes
        shell: bash
        run: |
          set -o pipefail
          cargo test -p synvoid-platform --profile ci -- --nocapture 2>&1 | tee /tmp/synvoid-sandbox-platform.log
          if grep -E 'SKIP: Landlock ABI unavailable|UNQUALIFIED: seccomp unavailable' /tmp/synvoid-sandbox-platform.log; then
            echo 'Linux runner did not enforce the requested native mechanisms.' >&2
            exit 1
          fi

      - name: Run jail workload and isolation tests
        run: |
          cargo test -p synvoid-jail-runtime --profile ci
          cargo test --test jail_isolation_guard --profile ci

  icmp-native-qualification:
    name: icmp-native-qualification
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.icmp_native_qualification }}
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable as of 2026-09-12

      - name: Install native qualification tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 nftables iputils-ping protobuf-compiler

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Record proof host
        run: |
          {
            echo '## Phase 93 Linux nftables native qualification'
            echo "- Proof SHA: $GITHUB_SHA"
            echo "- Runner: $RUNNER_OS / $RUNNER_ARCH"
            echo "- Kernel: $(uname -a)"
            echo "- Rust: $(rustc -Vv | tr '\n' ' ')"
            echo "- nftables: $(nft --version)"
            echo "- iproute2: $(ip -Version)"
            echo "- Privilege mode: root inside the disposable GitHub-hosted VM"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Preflight and review zero-mutation topology
        shell: bash
        run: |
          set -euo pipefail
          if sudo ip netns list | awk '($1 ~ /^synvoid-q-[a-z0-9-]+$/) { found = 1; print } END { exit !found }'; then
            echo 'Refusing native qualification: stale synvoid-q namespace exists.' >&2
            exit 1
          fi
          cargo xtask icmp-qualify --dry-run --json
          sudo -E env \
            PATH="$PATH" SYNVOID_ICMP_QUALIFY_NATIVE=1 \
            "$GITHUB_WORKSPACE/target/debug/cargo-xtask" icmp-qualify --check --json

      - name: Run two isolated native qualification passes
        shell: bash
        run: |
          set -euo pipefail
          run_native() {
            local run_id="$1"
            local evidence_path="$GITHUB_WORKSPACE/target/icmp-qualify-${run_id}.json"
            sudo -E env \
              PATH="$PATH" \
              SYNVOID_ICMP_QUALIFY_NATIVE=1 \
              SYNVOID_ICMP_QUALIFY_RUN="$run_id" \
              "$GITHUB_WORKSPACE/target/debug/cargo-xtask" icmp-qualify --native --json --timeout-secs 900 \
                --out "$evidence_path"
          }
          run_cleanup() {
            sudo -E env \
              PATH="$PATH" \
              SYNVOID_ICMP_QUALIFY_RUN="$1" \
              "$GITHUB_WORKSPACE/target/debug/cargo-xtask" icmp-qualify --cleanup --json
            if sudo ip netns list | awk '($1 ~ /^synvoid-q-[a-z0-9-]+$/) { found = 1; print } END { exit !found }'; then
              echo 'Harness namespace remains after cleanup.' >&2
              exit 1
            fi
          }
          native_status=0
          run_native "${GITHUB_RUN_ID}-a" || native_status=$?
          run_cleanup "${GITHUB_RUN_ID}-a"
          if (( native_status != 0 )); then
            exit "$native_status"
          fi
          native_status=0
          run_native "${GITHUB_RUN_ID}-b" || native_status=$?
          run_cleanup "${GITHUB_RUN_ID}-b"
          if (( native_status != 0 )); then
            exit "$native_status"
          fi

      - name: Upload bounded native evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: icmp-native-qualification-${{ github.run_id }}
          path: target/icmp-qualify-*.json
          if-no-files-found: warn
          retention-days: 30
