[package]
name = "synvoid-config"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Configuration management and validation"

[dependencies]
serde = { version = "1", features = ["derive"] }
schemars = "0.8"
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
toml = "0.8"
bytes = "1"
http = "1"
serde_json = "1"
tracing = "0.1"
anyhow = "1"
rand = "0.9"
parking_lot = "0.12"
rkyv = { package = "rkyv", version = "0.8", features = ["std", "alloc"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
ipnetwork = "0.18"
synvoid-config-model = { path = "../synvoid-config-model", version = "0.1" }

[features]
dns = []
icmp-filter = []
mesh = []
rkyv = []

[dev-dependencies]
tempfile = "3"
# Phase 128: the shipped `examples/dns/*.toml` parse fixtures moved here from
# `synvoid-dns`, because they assert the *persisted* schema and now belong to
# the crate that owns it. Already in Cargo.lock; no new supply-chain surface.
toml = "0.8"
serde = { version = "1", features = ["derive"] }
