[package]
name = "synvoid-jail-protocol"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Bounded SVJL jail wire contract"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
postcard = { version = "1", features = ["alloc"] }
sha2 = "0.10"
hex = "0.4"
subtle = "2"
thiserror = "2"
tracing = "0.1"
