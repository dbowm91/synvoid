[package]
name = "synvoid-icmp-filter"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "ICMP filtering with eBPF and nftables fallback"

[features]
default = []
icmp-ebpf = ["dep:aya"]
icmp-pf = []
# Outcome A (Phase 86): WFP is the primary supported Windows enforcement
# lane (typed protocol/ICMP conditions + engine transactions). The Windows
# Firewall COM lane (icmp-winfw) is retained only as a documented
# compatibility fallback (no transactions, no rate limiting, no readback).
icmp-winfw = ["dep:windows_firewall"]
icmp-wfp = ["dep:wfp", "dep:windows-sys"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
metrics = "0.22"
tracing = "0.1"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.13", optional = true }

# Windows enforcement backends (Phase 86: every retained backend feature
# activates every dependency it requires; nothing is claimed by source
# presence alone). wfp 0.2 (mullvad, MIT/Apache) supplies typed ICMP
# conditions + transactions; windows_firewall 0.8 supplies the COM fallback.
[target.'cfg(windows)'.dependencies]
wfp = { version = "0.2", optional = true }
windows_firewall = { version = "0.8", optional = true }
windows-sys = { version = "0.59", optional = true, features = ["Win32_Foundation", "Win32_Security", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[dev-dependencies]
serde_json = "1"
toml = "0.8"
