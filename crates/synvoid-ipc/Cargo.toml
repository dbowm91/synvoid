[package]
name = "synvoid-ipc"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Inter-process communication and signing"

[features]
default = []
rkyv = []

[dependencies]
synvoid-config = { path = "../synvoid-config" , version = "0.1" }
synvoid-utils = { path = "../synvoid-utils" , version = "0.1" }
synvoid-platform = { path = "../synvoid-platform" , version = "0.1" }
synvoid-metrics = { path = "../synvoid-metrics" , version = "0.1" }
synvoid-tls = { path = "../synvoid-tls" , version = "0.1" }
parking_lot = "0.12"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

sysinfo = "0.30"
dirs = "5"
tracing = "0.1"
hmac = "0.12"
sha3 = "0.10"
dashmap = "6"
socket2 = "0.5"
rand = "0.9"
libc = "0.2"
thiserror = "2"
subtle = "2"
serde_bytes = "0.11"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process", "socket", "fs", "net", "uio"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Console", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
tempfile = "3"
