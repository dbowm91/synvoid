[package]
name = "synvoid-block-store"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Block store for IP reputation and threat intelligence"

[features]
default = []
mesh = ["dep:synvoid-mesh", "synvoid-mesh/mesh"]

[dependencies]
synvoid-config = { path = "../synvoid-config" , version = "0.1" }
synvoid-core = { path = "../synvoid-core" , version = "0.1" }
synvoid-utils = { path = "../synvoid-utils" , version = "0.1" }
synvoid-waf = { path = "../synvoid-waf" , version = "0.1" }
synvoid-mesh = { path = "../synvoid-mesh", optional = true , version = "0.1" }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "sync", "fs"] }
arc-swap = "1"
ahash = "0.8"
tracing = "0.1"
metrics = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
proptest = "1.5"
