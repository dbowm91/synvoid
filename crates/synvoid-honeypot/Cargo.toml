[package]
name = "synvoid-honeypot"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Honeypot deployment and attack emulation"

[features]
default = []
mesh = []

[dependencies]
parking_lot = "0.12"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
hex = "0.4"
regex = "1"
async-trait = "0.1"
tracing = "0.1"
thiserror = "2"
metrics = "0.22"
sha2 = "0.10"
