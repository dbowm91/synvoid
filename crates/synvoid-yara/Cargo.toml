[package]
name = "synvoid-yara"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Canonical YARA execution boundary: engine, artifact binding, and narrow executor contract"

[dependencies]
arc-swap = "1"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
sha2 = "0.10"
walkdir = "2"
chrono = "0.4"
ed25519-dalek = "2"
base64 = "0.22"
parking_lot = "0.12"
hex = "0.4"
subtle = "2"
async-trait = "0.1"
yara-x = { version = "1.15", default-features = false, features = ["default-modules", "linkme"] }

[dev-dependencies]
tempfile = "3"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
