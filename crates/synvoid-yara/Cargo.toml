[package]
name = "synvoid-yara"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Canonical YARA execution boundary: engine, artifact binding, and narrow executor contract"

[dependencies]
arc-swap = "1"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
sha2 = "0.10"
walkdir = "2"
chrono = "0.4"
ed25519-dalek = "2"
base64 = "0.22"
parking_lot = "0.12"
hex = "0.4"
subtle = "2"
async-trait = "0.1"
# Phase 01 (2026-11-10): official yara-x 1.23.0 (released 2026-11-05)
# replaces the temporary manifest-only compat fork. It resolves Wasmtime
# ^48.0.8 (RUSTSEC-2026-0424 / -0423 / -0422 and the 2026-10 component-model
# batch) and zip ^9.0.5, satisfying the fork's documented removal condition.
# No `[patch.crates-io]` entry and no git source remain. The `linkme` feature
# was removed upstream after 1.15, so only `default-modules` is requested.
yara-x = { version = "1.23", default-features = false, features = ["default-modules"] }
# yara-x 1.23.0 declares `rsa = ^0.10.0-rc.19` and uses `rsa::Pkcs1v15Sign`,
# but rsa 0.10.0 final gates that item behind its `pkcs1v15` feature while the
# rc did not. Enabling the feature here keeps the resolved patched rsa 0.10.0
# (RUSTSEC-2023-0071 fixed) instead of pinning the vulnerable rc. This direct
# edge only turns on a feature of yara-x's own transitive dependency; remove
# it when yara-x declares the feature itself.
rsa = { version = "0.10", features = ["pkcs1v15"] }

[dev-dependencies]
tempfile = "3"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
