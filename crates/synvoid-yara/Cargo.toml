[package]
name = "synvoid-yara"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Canonical YARA execution boundary: engine, artifact binding, and narrow executor contract"

[dependencies]
arc-swap = "1"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
sha2 = "0.10"
walkdir = "2"
chrono = "0.4"
ed25519-dalek = "2"
base64 = "0.22"
parking_lot = "0.12"
hex = "0.4"
subtle = "2"
async-trait = "0.1"
# Phase 40 + Phase 103: yara-x 1.20.0 via the temporary manifest-only
# compat fork in `third-party/yara-x-compat` (root `[patch.crates-io]`;
# exact upstream 1.20.0 sources). Phase 40's manifest delta advanced the
# transitive Wasmtime line from 45.0.3 to 47.0.4 (tracking upstream PR
# #769). Phase 103 advanced the same line from 47.0.4 to 48.0.3 to
# remediate RUSTSEC-2026-0315 (47.0.4 affected) and RUSTSEC-2026-0316
# (47.0.4 + 36.0.15 affected; the direct runtime moved to 36.0.16 LTS
# in the same phase). Stock yara-x 1.21.0 (released 2026-09-29) still
# resolves wasmtime ^45.0.3, so it does not satisfy the removal condition.
# The `linkme` feature was removed upstream after 1.15, so only
# `default-modules` is requested. Removal: replace with an official
# fixed yara-x release per the fork's README.SYNVOID.md; enforced by
# `yara_fork_is_temporary_guard`.
yara-x = { version = "1.20", default-features = false, features = ["default-modules"] }

[dev-dependencies]
tempfile = "3"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
