[package]
name = "synvoid-yara"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Canonical YARA execution boundary: engine, artifact binding, and narrow executor contract"

[dependencies]
arc-swap = "1"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
sha2 = "0.10"
walkdir = "2"
chrono = "0.4"
ed25519-dalek = "2"
base64 = "0.22"
parking_lot = "0.12"
hex = "0.4"
subtle = "2"
async-trait = "0.1"
# Phase 40: yara-x 1.20.0 via the temporary manifest-only compat fork in
# `third-party/yara-x-compat` (root `[patch.crates-io]`; exact upstream
# 1.20.0 sources, wasmtime 45.0.3 -> 47.0.4 per upstream PR #769, which is
# still unreleased). This version-remediates GHSA-2jx3-ff3v-j7jj (>=1.19)
# and retires the wasmtime 40.0.4 advisory set. The `linkme` feature was
# removed upstream after 1.15, so only `default-modules` is requested.
# Removal: replace with an official fixed yara-x release per the fork's
# README.SYNVOID.md; enforced by `yara_fork_is_temporary_guard`.
yara-x = { version = "1.20", default-features = false, features = ["default-modules"] }

[dev-dependencies]
tempfile = "3"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
