[package]
name = "synvoid-platform"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Platform-specific abstractions and syscall wrappers"

[dependencies]
thiserror = "2"
tracing = "0.1"
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
serde_json = "1"
synvoid-ipc = { path = "../synvoid-ipc" , version = "0.1" }
