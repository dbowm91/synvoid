[package]
name = "synvoid-wasm-pow"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "WebAssembly proof-of-work mining"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
sha2.workspace = true
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = { version = "1.0", features = ["alloc"] }
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen-futures = "0.4"
hex = "0.4"
console_error_panic_hook = "0.1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
base64 = "0.22"
tracing = "0.1"
tracing-wasm = "0.2"

# Post-quantum cryptography - final FIPS 203 ML-KEM-768 (Phase 44).
# RustCrypto `ml-kem` (pure Rust, no_std + alloc) replaces the draft-Kyber
# `pqc_kyber_edit` fork: the fork's wire encoding is NOT byte-compatible with
# final ML-KEM despite matching sizes (proven by cross-impl mismatch test),
# and its KyberSlash provenance relied on a renamed package escaping audit.
# Server side already speaks final ML-KEM via aws-lc-rs (`pqc` crate), so both
# ends are now FIPS 203 final and interop was verified bidirectionally.
# Features: alloc (default) for no_std compat; zeroize for key zeroization on
# drop. No `getrandom` feature: randomness comes from getrandom 0.2 (js) via
# a local rand_core 0.10 adapter, keeping the proven wasm JS entropy path.
ml-kem = { version = "0.3", features = ["zeroize"] }
rand_core = "0.10"
zeroize = "1.8"

[dependencies.web-sys]
version = "0.3"
features = [
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Window",
    "console",
    "ResponseType",
]
