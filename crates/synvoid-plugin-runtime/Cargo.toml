[package]
name = "synvoid-plugin-runtime"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "WASM plugin runtime with sandboxing"

[features]
default = []
mesh = []
# Phase 28: explicit opt-in for in-process unsafe native extensions. Off by
# default so the sandboxed WASM runtime links no shared-library loader.
unsafe-native-extensions = ["dep:synvoid-native-extension"]

[dependencies]
metrics = "0.22"
# Phase 37: direct runtime is Wasmtime 36 LTS from crates.io (36.0.14+ fixes
# RUSTSEC-2026-0269; LTS supported through 2027-08-20). No git patch: 36
# coexists with the workspace bumpalo =3.19.0 pin (see baseline §4).
wasmtime = { version = "36.0.15", features = ["component-model"] }
axum = "0.8"
base64 = "0.22"
bytes = "1"
ed25519-dalek = { version = "2" }
hex = "0.4"
http = "1"
http-body = "1"
http-body-util = "0.1"
notify = "9.0.0-rc.3"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
synvoid-native-extension = { path = "../synvoid-native-extension", version = "0.1", optional = true }
synvoid-utils = { path = "../synvoid-utils", features = ["buffer"] , version = "0.1" }
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread"] }
toml = "0.8"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
wat = "1"
