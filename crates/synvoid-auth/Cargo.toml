[package]
name = "synvoid-auth"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Authentication, session management, CSRF, and brute-force lockout primitives"

[dependencies]
bcrypt = "0.19"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
base64 = "0.22"
parking_lot = "0.12"
http = "1"
thiserror = { version = "2", package = "thiserror" }
synvoid-utils = { path = "../synvoid-utils", version = "0.1" }
synvoid-config = { path = "../synvoid-config", version = "0.1" }

[dev-dependencies]
tempfile = "3"
proptest = "1.5"
tokio = { version = "1", features = ["full", "test-util"] }
