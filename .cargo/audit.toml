# cargo-audit configuration (Phase 25 baseline; Phases 26-31 landed; Phases 37/40
# corrected; Phase 103 re-audit).
# Mirrors the narrow advisory ignores in deny.toml so the blocking `cargo audit`
# gate (CI `dependency-security` job, `cargo xtask verify-release`) agrees with
# dependency policy. Each ignore MUST match a deny.toml entry with full exposure
# evidence in architecture/dependency_security_baseline_phase25.md.
# Pinned tool: cargo-audit 0.22.2 (see docs/testing/verification-contract.md).
# yara-x single owner is synvoid-yara; mesh no longer links it.
# Phase 103: Reviewed 2026-10-01; Re-audit 2026-11-01 (machine-enforced by
# deny_ignore_metadata_guard against deny.toml; audit.toml mirrors the set).
# Phase 103 also adds no new ignore: the Wasmtime RUSTSEC-2026-0315/0316
# findings are remediated by moving direct runtime to 36.0.16 LTS patch and
# the temporary YARA-X compat fork's Wasmtime to 48.0.3.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 (rsa 0.9.10, transitive via synvoid-yara -> yara-x
    # 1.20.0 compat fork; also via synvoid-dns / synvoid-dnssec-keystore /
    # synvoid-tls. Marvin Attack affects PKCS#1 v1.5 decryption only; no
    # SynVoid code path calls rsa::RsaPrivateKey::decrypt, so the affected
    # capability is unreachable; see deny.toml + baseline §11+).
    "RUSTSEC-2023-0071",
    # Phase 40 + Phase 103: wasmtime 40.0.4 is absent (YARA line is 48.0.3,
    # patched for RUSTSEC-2026-0315/0316; direct runtime is 36.0.16 LTS
    # patch, patched for RUSTSEC-2026-0316). The wasmtime 40.x ignores
    # were removed earlier. Mirrors deny.toml exactly
    # (see audit_config_mirrors_deny_ignores).
    # RUSTSEC-2026-0235 (rkyv 0.7.46 via parcel_sourcemap; minifier-internal sourcemaps only).
    "RUSTSEC-2026-0235",
]
