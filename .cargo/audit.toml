# cargo-audit configuration (Phase 25 baseline; Phases 26-31 landed; Phases 37/40
# corrected; Phase 103 re-audit; Phase 01 production-readiness refresh).
# Mirrors the narrow advisory ignores in deny.toml so the blocking `cargo audit`
# gate (CI `dependency-security` job, `cargo xtask verify-release`) agrees with
# dependency policy. Each ignore MUST match a deny.toml entry with full exposure
# evidence in architecture/dependency_security_baseline_phase25.md.
# Pinned tool: cargo-audit 0.22.2 (see docs/testing/verification-contract.md).
# yara-x single owner is synvoid-yara; mesh no longer links it. Phase 01 removed
# the temporary YARA-X compat fork: the official yara-x 1.23.0 resolves Wasmtime
# 48.0.8 and zip 9.5.0, so no ignore covers the YARA line.
# Reviewed: 2026-11-10; Re-audit: 2027-02-10 (machine-enforced by
# deny_ignore_metadata_guard against deny.toml; audit.toml mirrors the set).
# Version-remediated findings (rustls, rustls-webpki, webpki-roots, quinn-proto,
# libsqlite3-sys, Wasmtime, zip 9.x, zstd, zstd-safe, zstd-sys, tokio, yara-x,
# crypto-bigint, ctutils) carry no ignore.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 (rsa 0.9.10, direct via synvoid-dns /
    # synvoid-dnssec-keystore / synvoid-tls. yara-x 1.23.0 resolves the patched
    # rsa 0.10.0. Marvin Attack affects PKCS#1 v1.5 decryption only; no
    # SynVoid code path calls rsa::RsaPrivateKey::decrypt, so the affected
    # capability is unreachable; see deny.toml + baseline §11+).
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0235 (rkyv 0.7.46 via parcel_sourcemap; minifier-internal sourcemaps only).
    "RUSTSEC-2026-0235",
    # zip 3.0.0 is a utoipa-swagger-ui build dependency only; the runtime zip
    # 9.5.0 paths are patched. See deny.toml for the full capability assessment.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",
    # Unmaintained notices with no patched release; each has a deny.toml entry
    # carrying the dependency path, exposure and removal condition.
    "RUSTSEC-2023-0089",
    "RUSTSEC-2026-0374",
    "RUSTSEC-2025-0141",
    "RUSTSEC-2025-0057",
    "RUSTSEC-2024-0370",
    "RUSTSEC-2026-0173",
]
