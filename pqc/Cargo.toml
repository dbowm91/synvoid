[package]
name = "pqc"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Post-quantum cryptography primitives"

[dependencies]
aws-lc-rs = { version = "1", features = ["unstable"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
libcrux-ml-dsa = "0.0" # pre-release 0.0 intentionally pinned; any update may break—review changelog before bump
rand = "0.8" # kept at 0.8 for pqc; root uses rand 0.9 with rand_core_06 shim (see Cargo.toml:251)

[dependencies.tokio]
version = "1"
features = ["rt-multi-thread"]
optional = true

[features]
default = []
async = ["dep:tokio"]

[dev-dependencies]
criterion = "0.5"
tokio = { version = "1", features = ["full"] }

[[bench]]
name = "kem_bench"
harness = false
