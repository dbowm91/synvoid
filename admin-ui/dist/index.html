<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SynVoid Admin Dashboard</title>
    <!-- `src/styles.css` is the Tailwind build output of `src/tailwind.css`
         (`npm run build:css`). It is attached with `data-trunk` so trunk emits
         it into `dist/` as a hashed, fingerprinted asset. A plain
         `<link href="styles.css">` is not enough: trunk rebuilds `dist/` from
         scratch on every run and knows nothing about that file, so a bare
         `trunk build` shipped the panel with no stylesheet at all. -->
    <link rel="stylesheet" href="/styles-a20559e44bb1472d.css" integrity="sha384-1RKiOa+J2Gs2Uh2sdMW9cCy03UJKdSTId6A5EKkIA2pqne/tkdJ6+SIm0N7Dah8v"/>
    <!-- Web fonts referenced by the @font-face rules in src/tailwind.css.
         Copied verbatim into dist/ so `url("fonts/…")` resolves at runtime. -->
    
<link rel="modulepreload" href="/admin-ui-dcf1fe494cda25d0.js" crossorigin="anonymous" integrity="sha384-tm8DGmN67Mq9S+t5W38VNfMavkCSpCyFpAAKJUeZeFdrpJUjT9Es/xBNXtgTmjZw"><link rel="preload" href="/admin-ui-dcf1fe494cda25d0_bg.wasm" crossorigin="anonymous" integrity="sha384-B3t7m5zAbGVaxZ70Ea9xbRaOWHkuQVz3QAB5TUaseyXOA/5JLsZfWU2tCkApGnTu" as="fetch" type="application/wasm"></head>
<body class="min-h-screen">
    <div id="app">
        <div class="loading-screen">
            <div class="loading-logo">M</div>
            <div class="loading-spinner"></div>
            <p class="loading-text">Loading SynVoid Dashboard...</p>
        </div>
    </div>

<script type="module">
import init, * as bindings from '/admin-ui-dcf1fe494cda25d0.js';
const wasm = await init({ module_or_path: '/admin-ui-dcf1fe494cda25d0_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script></body>
</html>
