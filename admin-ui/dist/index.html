<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SynVoid Admin Dashboard</title>
    <!-- `src/styles.css` is the Tailwind build output of `src/tailwind.css`
         (`npm run build:css`). It is attached with `data-trunk` so trunk emits
         it into `dist/` as a hashed, fingerprinted asset. A plain
         `<link href="styles.css">` is not enough: trunk rebuilds `dist/` from
         scratch on every run and knows nothing about that file, so a bare
         `trunk build` shipped the panel with no stylesheet at all. -->
    <link rel="stylesheet" href="/styles-a501af4093cde161.css" integrity="sha384-B/L7XSbILVEPb0UnIT/xh2Gu2eJvz9gGDi5EeTl9ZAbJSdNOXoQTZtgwPNO9ujwH"/>
    <!-- Web fonts referenced by the @font-face rules in src/tailwind.css.
         Copied verbatim into dist/ so `url("fonts/…")` resolves at runtime. -->
    
<link rel="modulepreload" href="/admin-ui-5fcde02bd4dd84ea.js" crossorigin="anonymous" integrity="sha384-4AQn5p2+I/eoToIbl3CSoEv93fzV++A+ctn5xjsxxf644zwAIGr1DIuhR+bmDNmS"><link rel="preload" href="/admin-ui-5fcde02bd4dd84ea_bg.wasm" crossorigin="anonymous" integrity="sha384-SXCIvQmuEaMkIhGV6453hfsv231bvg0Ll+mPOsIagPy2uV7Ts6s8Ofc+L9211IWW" as="fetch" type="application/wasm"></head>
<body class="min-h-screen">
    <div id="app">
        <div class="loading-screen">
            <div class="loading-logo">M</div>
            <div class="loading-spinner"></div>
            <p class="loading-text">Loading SynVoid Dashboard...</p>
        </div>
    </div>

<!-- The WASM bootstrap must stay an external file: the admin server sends
     `script-src 'self'` with no 'unsafe-inline', so an inline bootstrap is
     refused and the panel never starts. Regenerated by
     `scripts/extract-bootstrap.py` from trunk's inline block. -->
<script type="module" src="/bootstrap.js" crossorigin="anonymous" integrity="sha384-XsrO6bFMcqdbxdhTN+t7c6Z937OQfQP7i+rNc3xfsz6mrZpgtpgNPgbzF89oAf1Y"></script></body>
</html>
