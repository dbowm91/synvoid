<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SynVoid Admin Dashboard</title>
    <!-- `src/styles.css` is the Tailwind build output of `src/tailwind.css`
         (`npm run build:css`). It is attached with `data-trunk` so trunk emits
         it into `dist/` as a hashed, fingerprinted asset. A plain
         `<link href="styles.css">` is not enough: trunk rebuilds `dist/` from
         scratch on every run and knows nothing about that file, so a bare
         `trunk build` shipped the panel with no stylesheet at all. -->
    <link rel="stylesheet" href="/styles-805c8d4a2a3a9810.css" integrity="sha384-qw8QBfVDHukZEvbFxSXpUK77exPA57Q/2zDyjFm920rMbN8HldNOByq/HOW6+03U"/>
    <!-- Web fonts referenced by the @font-face rules in src/tailwind.css.
         Copied verbatim into dist/ so `url("fonts/…")` resolves at runtime. -->
    
<link rel="modulepreload" href="/admin-ui-b508eb6e80295677.js" crossorigin="anonymous" integrity="sha384-ansCwD+Cnsr/i13FK5vWUgO8oTjjGN+fQ4cvXeh47BfIormIjX4x8Vu2ssXTosYg"><link rel="preload" href="/admin-ui-b508eb6e80295677_bg.wasm" crossorigin="anonymous" integrity="sha384-HvuBO1EXdtygmGsCztTRDQcdTI47j8tG322WlrVLW0vTJ21rDuGolXgP6TumNWfd" as="fetch" type="application/wasm"></head>
<body class="min-h-screen">
    <div id="app">
        <div class="loading-screen">
            <div class="loading-logo">M</div>
            <div class="loading-spinner"></div>
            <p class="loading-text">Loading SynVoid Dashboard...</p>
        </div>
    </div>

<!-- The WASM bootstrap must stay an external file: the admin server sends
     `script-src 'self'` with no 'unsafe-inline', so an inline bootstrap is
     refused and the panel never starts. Regenerated by
     `scripts/extract-bootstrap.py` from trunk's inline block. -->
<script type="module" src="/bootstrap.js" crossorigin="anonymous" integrity="sha384-GyyhAEXDnOZ6pmUsBZRIZu9HIKeuPosnZszKMVzTgmT5xMCacuhaq88TrLt4l2fo"></script></body>
</html>
