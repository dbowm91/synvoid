<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SynVoid Admin Dashboard</title>
    <!-- `src/styles.css` is the Tailwind build output of `src/tailwind.css`
         (`npm run build:css`). It is attached with `data-trunk` so trunk emits
         it into `dist/` as a hashed, fingerprinted asset. A plain
         `<link href="styles.css">` is not enough: trunk rebuilds `dist/` from
         scratch on every run and knows nothing about that file, so a bare
         `trunk build` shipped the panel with no stylesheet at all. -->
    <link rel="stylesheet" href="/styles-466c79d2c5f306b3.css" integrity="sha384-I7uv/NHj3oh75R7ebFc4VizrUc4J3gXt1mVjLIfjKoE7dlJEZwYaS9o9zE3cQe+U"/>
    <!-- Web fonts referenced by the @font-face rules in src/tailwind.css.
         Copied verbatim into dist/ so `url("fonts/…")` resolves at runtime. -->
    
<link rel="modulepreload" href="/admin-ui-6257c6c4f9a3a9ea.js" crossorigin="anonymous" integrity="sha384-JNBGQ5KGJXghtPbq/WnT2Fg0mFpb+PXpBNMoy5J28h/m/W+luuLdG5cDhJf9mYeD"><link rel="preload" href="/admin-ui-6257c6c4f9a3a9ea_bg.wasm" crossorigin="anonymous" integrity="sha384-RialxmMXDulsjEuv8Kmq68GQA9pA0O4NYwxMN3CIDoN5UwQvZYCI6ZFIdD5ZVcg3" as="fetch" type="application/wasm"></head>
<body class="min-h-screen">
    <div id="app">
        <div class="loading-screen">
            <div class="loading-logo">M</div>
            <div class="loading-spinner"></div>
            <p class="loading-text">Loading SynVoid Dashboard...</p>
        </div>
    </div>

<!-- The WASM bootstrap must stay an external file: the admin server sends
     `script-src 'self'` with no 'unsafe-inline', so an inline bootstrap is
     refused and the panel never starts. Regenerated by
     `scripts/extract-bootstrap.py` from trunk's inline block. -->
<script type="module" src="/bootstrap.js" crossorigin="anonymous" integrity="sha384-rAfU4JUj1EBsWD0B8oPc4J+Xwc8VV75rAzN7fHc0xGhooraSysrGVh928Bt9chnt"></script></body>
</html>
