<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SynVoid Admin Dashboard</title>
    <!-- `src/styles.css` is the Tailwind build output of `src/tailwind.css`
         (`npm run build:css`). It is attached with `data-trunk` so trunk emits
         it into `dist/` as a hashed, fingerprinted asset. A plain
         `<link href="styles.css">` is not enough: trunk rebuilds `dist/` from
         scratch on every run and knows nothing about that file, so a bare
         `trunk build` shipped the panel with no stylesheet at all. -->
    <link rel="stylesheet" href="/styles-93987fd3ea559ebe.css" integrity="sha384-7GHPPU4NluTzecNyoxlhhi+Ka5kR+e/fcuJiYKnXnMXBCtr3r4UfpbwZO58liZ7U"/>
    <!-- Web fonts referenced by the @font-face rules in src/tailwind.css.
         Copied verbatim into dist/ so `url("fonts/…")` resolves at runtime. -->
    
<link rel="modulepreload" href="/admin-ui-40cd20fe6d93e2f4.js" crossorigin="anonymous" integrity="sha384-cAe5DI3pqvv91dXMQaUT0KxImruwq3NXErhOdxXNUd/653Dv+ukJW4sp61ZTDPmA"><link rel="preload" href="/admin-ui-40cd20fe6d93e2f4_bg.wasm" crossorigin="anonymous" integrity="sha384-+DMV3uy3yGYvn8BBFHBnn2gNIZvxA/OsBEoms4pz7d7v0yAk4HpzqvJl2q8M8QxV" as="fetch" type="application/wasm"></head>
<body class="min-h-screen">
    <div id="app">
        <div class="loading-screen">
            <div class="loading-logo">M</div>
            <div class="loading-spinner"></div>
            <p class="loading-text">Loading SynVoid Dashboard...</p>
        </div>
    </div>

<script type="module">
import init, * as bindings from '/admin-ui-40cd20fe6d93e2f4.js';
const wasm = await init({ module_or_path: '/admin-ui-40cd20fe6d93e2f4_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script></body>
</html>
