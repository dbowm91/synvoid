[package]
name = "synvoid"
version = "1.1.0"
description = "High-performance WAF and reverse proxy with mesh networking"
edition = "2021"
license = "MIT"
exclude = ["plans/", ".opencode/", "fuzz/", "corpus/", "crash-*/", ".github/", "scripts/", "docs/", "architecture/", "tests/", "trusted-key.key", ".skills"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "synvoid"
path = "src/main.rs"

[[bin]]
name = "synvoid-vpn"
path = "src/bin/synvoid-vpn.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[features]
default = ["socket-handoff", "mesh", "dns", "erased_pool", "swagger-ui"]
dns = ["synvoid-config/dns", "synvoid-tls/dns", "synvoid-dns", "synvoid-dns/mesh", "synvoid-http/dns", "synvoid-admin/dns"]
# Phase 30: opt-in PKCS#11/HSM backing for DNSSEC via the keystore custody
# boundary. Off by default so normal builds carry no `cryptoki` in the
# dependency graph and perform no dynamic provider loading.
dns-hsm = ["dns", "synvoid-dns/hsm"]
socket-handoff = ["synvoid-admin/socket-handoff"]
wireguard = ["synvoid-tunnel/wireguard", "synvoid-admin/wireguard"]
icmp-filter = ["dep:synvoid-icmp-filter", "synvoid-config/icmp-filter", "synvoid-admin/icmp-filter"]
flood-ebpf = ["dep:aya", "synvoid-admin/flood-ebpf"]
origin_key_exchange = ["synvoid-integrity/origin_key_exchange"]
audit = []
post-quantum = ["synvoid-http-client/post-quantum", "synvoid-admin/post-quantum"]  # Marker feature; PQ TLS handled by rustls prefer-post-quantum
verify-pq = []
tun-rs = ["synvoid-tunnel/tun-rs"]
mesh = ["synvoid-config/mesh", "synvoid-http/mesh", "synvoid-static-files/mesh", "synvoid-serverless/mesh", "synvoid-admin/mesh", "dep:synvoid-mesh", "dep:synvoid-mesh-protocol", "synvoid-mesh/mesh", "synvoid-block-store/mesh", "synvoid-honeypot/mesh"]
buffer = ["synvoid-utils/buffer"]
erased_pool = []
rkyv = []
macos-sandbox = ["synvoid-admin/macos-sandbox", "synvoid-platform/macos-sandbox"]  # Enable macOS sandbox enforcement
test-utils = []
swagger-ui = ["dep:utoipa-swagger-ui"]
fastcgi_streaming = []  # Additive, opt-in: streaming FastCGI response handling (no default impact)
# Phase 28: explicit opt-in for in-process unsafe native extensions. Off by
# default so default builds carry no shared-library loader for plugins.
# (Independent platform uses of libloading such as Windows Wintun keep working;
# the isolation target is the plugin-runtime capability, not the crate universe.)
unsafe-native-extensions = ["synvoid-plugin-runtime/unsafe-native-extensions", "dep:synvoid-native-extension"]

[patch.crates-io]
# Phase 25: direct Wasmtime stays at 42.0.2 via this Git patch (crates.io has no
# 42.x patch release carrying the older fixes; 42.0.2 is patched for
# RUSTSEC-2026-0085/0086/0087/0088/0089/0091/0092/0093/0094/0095/0096/0114/0222
# but is AFFECTED by RUSTSEC-2026-0269 whose fix starts at 46.0.3).
# Upgrade to >=46.0.3 is blocked: wasmtime 46 requires bumpalo ^3.20.2 while
# minify-html 0.18.1 -> oxc_allocator 0.95.0 pins bumpalo =3.19.0 (same major,
# unresolvable; cargo cannot split). See
# architecture/dependency_security_baseline_phase25.md. Removal target: Phase 26
# (reassess when minify-html/oxc relaxes bumpalo or yara-x moves off wasmtime 40).
wasmtime = { git = "https://github.com/bytecodealliance/wasmtime", tag = "v42.0.2" }

[workspace]
members = [".", "pqc", "crates/synvoid-wasm-pow", "admin-ui", "examples/dynamic-plugin-example", "examples/embedded-app-example", "fuzz", "crates/synvoid-utils", "crates/synvoid-config", "crates/synvoid-core", "crates/synvoid-auth", "crates/synvoid-challenge", "crates/synvoid-tarpit", "crates/synvoid-waf", "crates/synvoid-proxy-cache", "crates/synvoid-tls", "crates/synvoid-plugin-runtime", "crates/synvoid-native-extension", "crates/synvoid-jail-runtime", "crates/synvoid-http-client", "crates/synvoid-serverless", "crates/synvoid-geoip", "crates/synvoid-integrity", "crates/synvoid-upstream", "crates/synvoid-tunnel", "crates/synvoid-proxy", "crates/synvoid-http", "crates/synvoid-http3", "crates/synvoid-dns", "crates/synvoid-dnssec-keystore", "crates/synvoid-admin", "crates/synvoid-mesh", "crates/synvoid-mesh-protocol", "crates/synvoid-app-handlers", "crates/synvoid-platform", "crates/synvoid-cli", "crates/synvoid-metrics", "crates/synvoid-theme", "crates/synvoid-icmp-filter", "crates/synvoid-honeypot", "crates/synvoid-upload", "crates/synvoid-yara", "crates/synvoid-ipc", "crates/synvoid-block-store", "crates/synvoid-app-server", "crates/synvoid-vpn-client", "crates/synvoid-static-files", "crates/synvoid-filter", "tools/synvoid-repo-guards", "tools/xtask"]

[workspace.package]
license = "MIT"
edition = "2021"
repository = "https://github.com/dbowm91/synvoid"
authors = ["MaluWAF Project"]

[workspace.dependencies]
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
axum = "0.8"
sha2 = "0.10"
synvoid-filter = { path = "crates/synvoid-filter" , version = "0.1" }

[dependencies]
tokio = { workspace = true }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful", "http1", "http2", "client", "client-legacy"] }
# hyper-rustls: Phase 31 removed; owned by synvoid-http-client (egress TLS)
# tower: Phase 31 moved to [dev-dependencies] (test-only: tower::ServiceExt::oneshot in admin contract tests)
tower-http = { version = "0.6", features = ["fs", "cors"] }
axum = { version = "0.8", features = ["ws", "macros", "json"] }
# axum-extra: Phase 31 removed; 0 root src uses (canonical use in domain crates)
# http-body: Phase 31 removed; 0 root src uses (http-body-util retained for BoxBody adapters)
http-body-util = "0.1"
# tokio-util: removed; owned by synvoid-static-files (see plans/root_dependency_ownership.md)
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# postcard for distributed state (Phase 31: direct rkyv removed; 0 root src uses, canonical use in domain crates)
postcard = { version = "1", features = ["alloc"] }

toml = "0.8"
anyhow = "1"
# bitflags: Phase 31 removed; 0 root src uses (canonical use in domain crates)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# tracing-appender: Phase 31 removed; 0 root src uses
# isbot: moved to synvoid-waf (see plans/root_dependency_ownership.md)
stegoeggo = "0.2"
regex = "1"
parking_lot = "0.12"
dashmap = "7.0.0-rc2"
arc-swap = "1"
# moka: Phase 31 removed; 0 root src uses (canonical use in domain crates)
memmap2 = "0.9"
metrics = "0.22"
metrics-exporter-prometheus = "0.18"
http = "1"
# ipnetwork: Phase 31 removed; 0 root src uses (canonical use in domain crates)
rand = "0.9"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
futures = "0.3"
sysinfo = "0.38"
nix = { version = "0.29", features = ["signal", "process", "socket", "fs", "net", "uio", "sched"] }
chrono = { version = "0.4", features = ["serde"] }
# notify: Phase 31 removed from root; owned by synvoid-tls (cert watcher) + synvoid-plugin-runtime (hot-reload)
# aho-corasick: Phase 31 removed; 0 root src uses (canonical WAF use in synvoid-waf)
# unicode-normalization: Phase 31 removed; 0 root src uses (canonical use in domain crates)
# libinjectionrs: Phase 31 removed; 0 root src uses (canonical WAF use in synvoid-waf)
# serde_bytes: Phase 31 removed; 0 root src uses (canonical use in synvoid-ipc)
synvoid-cli = { path = "crates/synvoid-cli" , version = "0.1" }
synvoid-config = { path = "crates/synvoid-config" , version = "0.1" }
synvoid-dns = { path = "crates/synvoid-dns", optional = true , version = "0.1" }
synvoid-icmp-filter = { path = "crates/synvoid-icmp-filter", optional = true , version = "0.1" }
synvoid-honeypot = { path = "crates/synvoid-honeypot" , version = "0.1" }
synvoid-upload = { path = "crates/synvoid-upload" , version = "0.1" }
synvoid-yara = { path = "crates/synvoid-yara" , version = "0.1" }
synvoid-ipc = { path = "crates/synvoid-ipc" , version = "0.1" }
synvoid-http-client = { path = "crates/synvoid-http-client" , version = "0.1" }
synvoid-platform = { path = "crates/synvoid-platform" , version = "0.1" }
synvoid-upstream = { path = "crates/synvoid-upstream" , version = "0.1" }
synvoid-tunnel = { path = "crates/synvoid-tunnel" , version = "0.1" }

# DNS support (Phase 31: hickory-proto/hickory-resolver/getrandom removed from root;
# 0 root src uses — DNS wire/resolution owned by synvoid-dns via its own hickory edges)
thiserror = { version = "2", package = "thiserror" }

clap = { version = "4", features = ["derive"] }
# infer: removed; owned by synvoid-app-handlers (see plans/root_dependency_ownership.md)
# tempfile: Phase 31 moved to [dev-dependencies] (test-only fixtures)
uuid = { version = "1", features = ["v4", "serde"] }
# pin-project-lite: Phase 31 removed; 0 root src uses (canonical use in domain crates)
bcrypt = "0.19"
# dirs: Phase 31 removed; 0 root src uses (canonical use in domain crates)
# flate2: Phase 31 moved to [dev-dependencies] (worker minifier unit-test fixtures only)
# tar: Phase 31 removed; 0 root src uses (canonical use in domain crates)
mime_guess = "2"

# Post-Quantum Cryptography (Phase 31: pqc/zeroize removed from root;
# pqc owned by synvoid-config/synvoid-integrity, zeroize by keystore cratess)
# Minification deps: all moved to synvoid-static-files (see plans/root_dependency_ownership.md)

# File system utilities (Phase 31: walkdir removed; 0 root src uses)

# Database
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

# TLS + Post-Quantum Cryptography (Phase 31: rustls/rustls-pki-types/aws-lc-rs
# removed from root; 0 direct `rustls::` uses — PQ/TLS features owned by
# synvoid-tls + synvoid-http-client, unified via Cargo feature resolution)
tokio-rustls = "0.26"
# rustls-post-quantum: removed; PQ handled by rustls `prefer-post-quantum` + `aws-lc-rs` features (see plans/root_dependency_ownership.md)
# x509-parser: removed from root (RHP-R02 batch 1); declared in synvoid-tls and synvoid-mesh
# instant-acme: moved to synvoid-tls (see plans/root_dependency_ownership.md)

# Cryptography utilities
subtle = "2"

# HSM / PKCS#11 support (Phase 30): owned by `synvoid-dnssec-keystore`
# behind its opt-in `pkcs11`/`hsm` features (root `dns-hsm`). There is no
# root `cryptoki` edge; normal builds carry no PKCS#11 provider surface.

# QUIC — root-owned for DNS-over-QUIC (crates/synvoid-dns/src/doq.rs) and TCP protocol detection (src/tcp/listener.rs)
# h3, h3-quinn: owned by synvoid-http3 (see plans/architecture_boundary_cleanup_iteration_1.md)
quinn = { version = "0.11", features = ["runtime-tokio"] }


# GeoIP support
# maxminddb: removed; owned by synvoid-geoip (see plans/root_dependency_ownership.md)
zip = "2"

# Dynamic plugin loading lives in synvoid-native-extension (Phase 28, opt-in via
# the `unsafe-native-extensions` feature). There is no unconditional root
# `libloading` edge: the only remaining direct use is the Windows Wintun
# loader (src/platform/windows/wintun.rs, #[cfg(windows)]), scoped below.

synvoid-utils = { path = "crates/synvoid-utils", features = ["buffer"] , version = "0.1" }
synvoid-core = { path = "crates/synvoid-core", features = ["utoipa"] , version = "0.1" }
synvoid-tarpit = { path = "crates/synvoid-tarpit" , version = "0.1" }
synvoid-auth = { path = "crates/synvoid-auth" , version = "0.1" }
synvoid-challenge = { path = "crates/synvoid-challenge" , version = "0.1" }
synvoid-waf = { path = "crates/synvoid-waf" , version = "0.1" }
synvoid-plugin-runtime = { path = "crates/synvoid-plugin-runtime" , version = "0.1" }
synvoid-native-extension = { path = "crates/synvoid-native-extension", optional = true , version = "0.1" }
synvoid-jail-runtime = { path = "crates/synvoid-jail-runtime" , version = "0.1" }
synvoid-tls = { path = "crates/synvoid-tls" , version = "0.1" }
# synvoid-proxy-cache: Phase 31 removed; 0 root src uses (root proxy_cache/ removed Phase 03)
synvoid-admin = { path = "crates/synvoid-admin" , version = "0.1" }
synvoid-proxy = { path = "crates/synvoid-proxy" , version = "0.1" }
synvoid-http = { path = "crates/synvoid-http" , version = "0.1" }
synvoid-http3 = { path = "crates/synvoid-http3" , version = "0.1" }
synvoid-serverless = { path = "crates/synvoid-serverless" , version = "0.1" }
synvoid-geoip = { path = "crates/synvoid-geoip" , version = "0.1" }
synvoid-integrity = { path = "crates/synvoid-integrity" , version = "0.1" }
synvoid-mesh = { path = "crates/synvoid-mesh", optional = true , version = "0.1" }
synvoid-mesh-protocol = { path = "crates/synvoid-mesh-protocol", optional = true , version = "0.1" }
synvoid-app-handlers = { path = "crates/synvoid-app-handlers" , version = "0.1" }
synvoid-metrics = { path = "crates/synvoid-metrics" , version = "0.1" }
synvoid-theme = { path = "crates/synvoid-theme" , version = "0.1" }
synvoid-block-store = { path = "crates/synvoid-block-store" , version = "0.1" }
synvoid-app-server = { path = "crates/synvoid-app-server" , version = "0.1" }
synvoid-vpn-client = { path = "crates/synvoid-vpn-client" , version = "0.1" }
synvoid-static-files = { path = "crates/synvoid-static-files" , version = "0.1" }
synvoid-filter = { path = "crates/synvoid-filter" , version = "0.1" }

# WASM support for plugins
# wasmtime: moved to synvoid-plugin-runtime (see plans/root_dependency_ownership.md)

# URL parsing (already used elsewhere)
url = "2"

# WireGuard (optional - requires defguard_boringtun)
# defguard_boringtun: moved to synvoid-tunnel (see plans/root_dependency_ownership.md)

# Unix domain socket support for HTTP client
# hyperlocal: moved to synvoid-http-client (see plans/root_dependency_ownership.md)


# systemd readiness notification
# sd-notify: removed (see plans/root_dependency_ownership.md)

# Logging facade (Phase 31: log removed; 0 `log::` uses — tracing is the facade)

# OpenAPI / Swagger UI
schemars = "0.8"
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"], optional = true }
# prost is required for tonic codegen: build.rs `tonic-prost-build` emits
# `::prost::Message` derives in OUT_DIR/synvoid.control.rs (Phase 31: retained
# as composition_runtime for gRPC control API, no direct `prost::` in src/).
prost = "0.14"
# prost-build: removed from root (RHP-R02 batch 1); 0 uses anywhere; was in wrong [dependencies] section
lru_time_cache = "0.11"
# linked-hash-map: removed (see plans/root_dependency_ownership.md)
indexmap = "2"
ahash = "0.8"
# smallvec: Phase 31 removed; 0 root src uses
# aes-gcm: Phase 31 removed; 0 root src uses (canonical use in domain crates)
async-trait = "0.1"
daemonize2 = "0.6"
# digest: Phase 31 removed; 0 `digest::` uses (sha2::Digest via sha2 crate)
ed25519-dalek = { version = "2" }
# rsa: Phase 31 removed; 0 `rsa::` uses (verification via synvoid-dns/keystore)
# rand_core_06: Phase 31 removed with pqc (shim owned by pqc crate)
hkdf = "0.12"
hmac = "0.12"
socket2 = "0.6"
# sha1: Phase 31 removed; 0 `sha1::` uses (DS/NSEC3 interop owned by synvoid-dns/keystore)
# sha3: Phase 31 removed; 0 `sha3::` uses (canonical use in domain crates)
# x25519-dalek: Phase 31 removed; 0 root src uses
# base32: Phase 31 removed; 0 root src uses
libc = "0.2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Console", "Win32_Networking_WinSock", "Win32_Security"] }
tonic = { version = "0.14", features = ["gzip", "transport", "tls-native-roots"] }
# tonic-reflection: Phase 31 removed; 0 root src uses
tonic-prost = "0.14"

# Raft consensus (Phase 31: openraft removed from root; 0 root src uses — Raft owned by synvoid-mesh)
# openraft-legacy: removed from root (RHP-R02 batch 1); 0 uses anywhere
async-stream = "0.3.6"

[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.13", optional = true }

[target.'cfg(windows)'.dependencies]
# Phase 28: independent platform use only (Wintun DLL loading). Plugin loader
# authority lives in synvoid-native-extension; this edge must not be used for
# plugin loading.
libloading = "0.8"

[build-dependencies]
tonic-prost-build = "0.14"
chrono = "0.4"

# Fuzzing
[profile.dev]
opt-level = 0
debug = true

[profile.ci]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"
incremental = false
panic = "unwind"

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
strip = true

[dev-dependencies]
# Phase 25: this self edge MUST keep `default-features = false`. Enabling default
# features here leaks mesh/dns into nominal `--no-default-features` test builds,
# which silently compiles out every `#[cfg(not(feature = ...))]` absence branch
# repo-wide (see architecture/admin_contract_phase05_closeout.md and the
# `root_no_default_feature_leak_guard`). Tests needing mesh/dns declare explicit
# `required-features` on their [[test]] target or `#[cfg(feature = ...)]` gates.
synvoid = { path = ".", features = ["test-utils"], default-features = false , version = "1.1" }
libfuzzer-sys = "0.4"
proptest = "1.5"
proptest-derive = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }
wasmtime = "42.0.2"
wat = "1"
# Phase 31: test-only runtime deps moved from [dependencies] (0 production src uses)
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
flate2 = "1"

[[bench]]
name = "bench_attack_detection"
harness = false

[[bench]]
name = "bench_normalization"
harness = false

[[bench]]
name = "bench_proxy_cache"
harness = false

[[bench]]
name = "bench_proxy_headers"
harness = false

[[bench]]
name = "bench_ratelimit"
harness = false

[[bench]]
name = "bench_dns"
harness = false
required-features = ["dns"]

[[bench]]
name = "bench_wasm"
harness = false

[[bench]]
name = "bench_attack_detection_wave10"
harness = false

# Phase 25: feature-specific integration targets. These tests import mesh-gated
# items at top level and cannot build minimally; `required-features` keeps
# `cargo test --no-default-features` honest instead of failing to compile.
[[test]]
name = "mesh_startup_rollback"
required-features = ["mesh"]
