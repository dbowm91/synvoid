[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false
description = "SynVoid xtask verification and release helpers"

[[bin]]
name = "cargo-xtask"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
