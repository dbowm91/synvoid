[target.x86_64-unknown-linux-musl]
pre-build = ["bash -c 'apt-get update && apt-get install -y curl unzip && curl -sL https://github.com/protocolbuffers/protobuf/releases/download/v25.1/protoc-25.1-linux-x86_64.zip -o /tmp/protoc.zip && unzip -o /tmp/protoc.zip -d /usr/local bin/protoc'"]
env = { "CARGO_BUILD_JOBS" = "2" }

[target.aarch64-unknown-linux-gnu]
pre-build = ["bash -c 'apt-get update && apt-get install -y curl unzip && curl -sL https://github.com/protocolbuffers/protobuf/releases/download/v25.1/protoc-25.1-linux-x86_64.zip -o /tmp/protoc.zip && unzip -o /tmp/protoc.zip -d /usr/local bin/protoc'"]

[target.x86_64-unknown-freebsd]
pre-build = ["bash -c 'apt-get update && apt-get install -y curl unzip && curl -sL https://github.com/protocolbuffers/protobuf/releases/download/v25.1/protoc-25.1-linux-x86_64.zip -o /tmp/protoc.zip && unzip -o /tmp/protoc.zip -d /usr/local bin/protoc'", "bash -c 'for lib in geom memstat kvm procstat devstat execinfo; do [ ! -f /usr/lib/lib${lib}.so ] && [ -f /usr/lib/lib${lib}.so.5 ] && ln -sf /usr/lib/lib${lib}.so.5 /usr/lib/lib${lib}.so || true; done'"]
