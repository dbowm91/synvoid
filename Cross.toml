[target.x86_64-unknown-linux-musl]
pre-build = ["bash -c 'apt-get update && apt-get install -y curl unzip && curl -sL https://github.com/protocolbuffers/protobuf/releases/download/v25.1/protoc-25.1-linux-x86_64.zip -o /tmp/protoc.zip && unzip -o /tmp/protoc.zip -d /usr/local bin/protoc'"]
env = { "CARGO_BUILD_JOBS" = "2" }

[target.aarch64-unknown-linux-gnu]
pre-build = ["bash -c 'apt-get update && apt-get install -y curl unzip && curl -sL https://github.com/protocolbuffers/protobuf/releases/download/v25.1/protoc-25.1-linux-x86_64.zip -o /tmp/protoc.zip && unzip -o /tmp/protoc.zip -d /usr/local bin/protoc'"]

[target.x86_64-unknown-freebsd]
pre-build = ["bash -c 'apt-get update && apt-get install -y curl unzip && curl -sL https://github.com/protocolbuffers/protobuf/releases/download/v25.1/protoc-25.1-linux-x86_64.zip -o /tmp/protoc.zip && unzip -o /tmp/protoc.zip -d /usr/local bin/protoc'", "bash -c 'for lib in geom memstat kvm procstat devstat execinfo; do if [ ! -f /usr/lib/lib${lib}.so ] && [ ! -f /usr/lib/lib${lib}.a ]; then echo \"\" | x86_64-unknown-freebsd12-gcc -x c -c - -o /tmp/stub_${lib}.o 2>/dev/null && ar rcs /usr/lib/lib${lib}.a /tmp/stub_${lib}.o 2>/dev/null || touch /usr/lib/lib${lib}.a; fi; done'"]
